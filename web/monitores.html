<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealGuard · Monitores</title>
<!-- Arquivo único e sem dependências externas: funciona na rede isolada da AIBOX. -->
<style>
@font-face{font-family:"Archivo";src:url(/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(/fonts/poppins-300.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(/fonts/poppins-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(/fonts/poppins-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(/fonts/poppins-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  color-scheme:dark;
  --bg:#071022;--surface:#0d1a30;--surface-2:#13223c;--surface-3:#1b2c4a;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --ink:#e8edf4;--ink-2:#aab4c3;--muted:#7d8898;
  --accent:#3987e5;--accent-soft:rgba(57,135,229,.16);
  --good:#22b04a;--warn:#fab219;--bad:#e5484d;
  --radius:10px;--radius-sm:7px;--gap:4px;
  --font:"Archivo",Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra superior (fina) ---------- */
.bar{height:40px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:620;font-size:13px;white-space:nowrap}
.mark{width:18px;height:24px;display:grid;place-items:center}
.mark svg{width:17px;height:23px}
.sym{overflow:visible}
.sym .sh,.sym .sh-d{fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.sym .sh-d{stroke:#4f535a;transform:translate(3px,4px)}.sym .sh{stroke:url(#g-silver)}
.sym .ps-d{fill:#8c6b2b;transform:translate(2.5px,3.5px)}.sym .ps{fill:url(#g-gold)}
.wm{font-family:"Poppins",var(--font);letter-spacing:.06em;font-weight:700}.wm span{font-weight:300}
.brand small{color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:12px;white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--line-2)}
.pill b{color:var(--ink);font-weight:600}
.pill .sep{width:1px;height:12px;background:var(--line-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.good{background:var(--good);box-shadow:0 0 0 3px rgba(34,176,74,.18)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(250,178,25,.16)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.18)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:3px 9px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg .lbl{align-self:center;padding:0 6px 0 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ibtn{height:28px;min-width:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink-2);font-size:12px;white-space:nowrap}
.ibtn:hover{color:var(--ink);border-color:var(--line-2)}
.ibtn.on{background:var(--accent-soft);border-color:rgba(57,135,229,.45);color:#cfe2fb}
.clock{font:600 12.5px var(--mono);color:var(--ink-2);padding:0 4px;white-space:nowrap}
kbd{font:11px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted);background:var(--bg)}

/* ---------- grade de monitores ---------- */
.wall{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap);background:#000}
.tile{position:relative;background:#030405;overflow:hidden;border-radius:3px;outline:1px solid rgba(255,255,255,.05);cursor:pointer;min-width:0;min-height:0}
.tile.sel{outline:2px solid var(--accent);outline-offset:-2px}
.tile img,.tile canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.tile .ov{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:6px 8px;pointer-events:none;font-size:11.5px;transition:opacity .35s}
.tile .ov.t{top:0;background:linear-gradient(rgba(0,0,0,.66),rgba(0,0,0,0))}
.tile .ov.b{bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7));justify-content:space-between}
.tile .cam{font:600 11px var(--mono);letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;white-space:nowrap}
.tile .name{color:#e9eef5;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.tile .tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:700 10px var(--font);letter-spacing:.08em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tile .tag.live{background:rgba(229,72,77,.92);color:#fff}
.tile .tag.demo{background:rgba(250,178,25,.92);color:#1b1300}
.tile .tag.vid{background:rgba(57,135,229,.92);color:#fff}
.tile .tag .r{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
.tile .ts{font:500 11px var(--mono);color:#dfe6ef;text-shadow:0 1px 2px #000}
.tile .dir{font:600 10.5px var(--font);letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:rgba(18,22,29,.8);border:1px solid rgba(255,255,255,.12)}
.tile .dir.entry{color:#9ce8b1}.tile .dir.exit{color:#ffd27a}.tile .dir.auto{color:#a9c8f2}
.tile .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
.tile .msg b{display:block;color:var(--ink-2);font:700 12px var(--font);letter-spacing:.14em;margin-bottom:4px}
.tile.empty{cursor:default;background:repeating-linear-gradient(135deg,#050607 0 10px,#07090b 10px 20px)}
.tile.small .ov{padding:3px 5px;font-size:10px}.tile.small .name,.tile.small .dir,.tile.small .ts{display:none}
.tile.small .cam{font-size:9.5px;padding:1px 4px}.tile.small .tag{font-size:8.5px;padding:1px 5px}
body.idle .tile .ov.b,body.idle .tile .ov.t .name{opacity:0}
body.idle{cursor:none}
.wall.solo{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
.wall.solo .tile:not(.sel){display:none}
.wall.solo .tile.sel{outline:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- gerenciador (gaveta) ---------- */
.mgr{position:fixed;top:40px;right:0;bottom:0;width:360px;max-width:100vw;background:rgba(15,19,25,.97);border-left:1px solid var(--line-2);backdrop-filter:blur(10px);transform:translateX(100%);transition:transform .22s ease;z-index:6;display:flex;flex-direction:column}
.mgr.open{transform:none}
.mgr header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mgr header h2{margin:0;font-size:13.5px;font-weight:620;flex:1}
.mgr .body{flex:1;overflow:auto;padding:4px 14px 18px}
.mgr h3{margin:16px 0 8px;font-size:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:8px}
.mgr h3 span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meter{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px}
.meter .k{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px}.meter .k span+span{white-space:nowrap;opacity:.8}
.meter .v{font:650 17px var(--font);margin-top:2px}
.meter .v small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.meter .track{height:4px;border-radius:2px;background:#222937;margin-top:6px;overflow:hidden}
.meter .fill{height:100%;border-radius:2px;background:var(--accent);transition:width .4s}
.meter .fill.warn{background:var(--warn)}.meter .fill.bad{background:var(--bad)}
.spark{display:block;width:100%;height:30px;margin-top:6px}
.cardm{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.cardm.sel{border-color:rgba(57,135,229,.5)}
.cardm .hd{display:flex;align-items:center;gap:8px}
.cardm .hd b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:650;letter-spacing:.04em;padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge.good{color:#8fe3a6;border-color:rgba(34,176,74,.4);background:rgba(34,176,74,.1)}
.badge.warn{color:#ffd27a;border-color:rgba(250,178,25,.4);background:rgba(250,178,25,.08)}
.badge.bad{color:#ffaaad;border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.1)}
.src{font:11px var(--mono);color:var(--muted);margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:10px}
.kv div{min-width:0}
.kv span{display:block;color:var(--muted);font-size:10.5px}
.kv b{font-weight:600;font-size:12.5px;white-space:nowrap}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.note{font-size:11.5px;color:var(--muted);margin:8px 0 0}
.mgr footer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.mgr footer a{color:var(--accent);text-decoration:none;margin-left:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:11.5px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.bad{border-color:rgba(229,72,77,.5)}

@media (max-width:820px){.brand small,.hide-sm{display:none}.seg button{padding:3px 6px}}
@media (max-width:560px){.pill .x{display:none}.clock{display:none}.brand{font-size:0;gap:0}.bar{gap:6px;padding:0 6px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.seg .lbl{display:none}.pill{padding:0 8px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f6f8"/><stop offset=".45" stop-color="#cdd0d4"/><stop offset="1" stop-color="#a3a7ad"/></linearGradient><linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dd9c"/><stop offset=".5" stop-color="#dcbf77"/><stop offset="1" stop-color="#c49b4a"/></linearGradient></defs>
  <symbol id="b-shield" viewBox="0 0 136 186"><path d="M12 74V34Q12 28 18 26L64 9.5Q68 8 72 9.5L118 26Q124 28 124 34V74"/><path d="M12 91V122C12 145 40 166 68 177C96 166 124 145 124 122V91"/></symbol>
  <symbol id="b-person" viewBox="0 0 136 186"><circle cx="68.5" cy="80" r="17"/><path d="M37 135V130C37 113 51 103 68.5 103S100 113 100 130V135Q100 137 98 137H39Q37 137 37 135Z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M14.5 4v16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></symbol>
</svg>

<div class="bar">
  <div class="brand"><div class="mark"><svg class="sym" viewBox="0 0 136 186" aria-hidden="true"><use class="sh-d" href="#b-shield"/><use class="sh" href="#b-shield"/><use class="ps-d" href="#b-person"/><use class="ps" href="#b-person"/></svg></div><span class="wm"><span>REAL</span>GUARD</span> <small>· Monitores</small></div>
  <button class="pill" id="sysPill" title="Abrir o gerenciador (G)"><span class="dot" id="sysDot"></span><b id="sysTxt">conectando…</b><span class="x" id="sysExtra"></span></button>
  <span class="sp"></span>
  <div class="seg" id="lay" title="Divisão da tela">
    <button data-n="auto" title="Divide sozinho pelas câmeras transmitindo (A)">Auto</button>
    <span class="lbl hide-sm">Demonstração</span>
    <button data-n="4">4</button><button data-n="8">8</button><button data-n="16">16</button><button data-n="32">32</button>
  </div>
  <button class="ibtn" id="mgrBtn" title="Gerenciador de monitores (G)"><svg class="i"><use href="#i-panel"/></svg><span class="hide-sm">Gerenciador</span></button>
  <button class="ibtn" id="fsBtn" title="Tela cheia (F)"><svg class="i"><use href="#i-expand"/></svg></button>
  <span class="clock num" id="clock"></span>
</div>

<main class="wall" id="wall"></main>

<aside class="mgr" id="mgr" aria-hidden="true">
  <header><svg class="i"><use href="#i-panel"/></svg><h2>Gerenciador de monitores</h2><button class="ibtn" id="mgrClose" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></header>
  <div class="body" id="mgrBody"></div>
  <footer><span id="mgrUpd">—</span><a href="/" id="dashLink">Abrir o dashboard ↗</a></footer>
</aside>

<script src="/ui/i18n.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
async function api(p,o={}){o={credentials:'same-origin',...o};if((o.method||'GET').toUpperCase()!=='GET')o.headers={...(o.headers||{}),'X-RealGuard':'1'};
  const r=await fetch(p,o);let b=null;try{b=await r.json()}catch(e){}
  if(r.status===401){location.replace('/login');throw new Error('Sessão expirada.')}
  if(!r.ok)throw new Error((b&&typeof b.detail==='string'&&b.detail)||'Erro '+r.status);return b}
function toast(t,ok=true){const d=document.createElement('div');d.className='toast'+(ok?'':' bad');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
const store={get(k,d){try{const v=localStorage.getItem('rg.mon.'+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('rg.mon.'+k,v)}catch(e){}}};

/* ---------- divisão automática da tela ---------- */
// n monitores -> [colunas, linhas]. 2 = lado a lado; 4 = 2×2; 8 = 4×2; 16 = 4×4; 32 = 8×4.
function gridFor(n){if(n<=1)return[1,1];if(n===2)return[2,1];if(n<=4)return[2,2];if(n<=6)return[3,2];if(n<=8)return[4,2];if(n===9)return[3,3];
  if(n<=12)return[4,3];if(n<=16)return[4,4];if(n<=20)return[5,4];if(n<=32)return[8,4];const c=Math.ceil(Math.sqrt(n*16/9));return[c,Math.ceil(n/c)]}

const S={data:null,layout:store.get('layout','auto'),sel:0,solo:false,mgr:store.get('mgr','0')==='1',hist:{cpu:[],fps:{}},tiles:[]};
const DIR={ENTRY:['entry','ENTRADA'],EXIT:['exit','SAÍDA'],AUTO:['auto','AUTO']};
const STATE={online:['good','Online'],reconectando:['warn','Reconectando'],iniciando:['warn','Iniciando'],erro:['bad','Com erro'],inativa:['','Inativa'],em_espera:['','Só vídeo · pronta'],conectando:['warn','Conectando'],sem_senha:['bad','Sem senha guardada']};
const pad2=n=>String(n).padStart(2,'0');
const camLabel=i=>'CAM '+pad2(i);

/* Um único vídeo para a janela inteira: o <img> do monitor ao vivo. As cópias de
   demonstração são desenhadas a partir dele num <canvas> — a AIBOX envia um vídeo só,
   seja com 1 ou com 32 monitores (e o navegador não trava no limite de conexões). */
const video=new Image();video.alt='Câmera ao vivo';video.decoding='async';
function liveSrc(){video.src='/video?m='+Date.now()}

function slots(){const d=S.data;const live=(d?.monitores||[]).filter(m=>m.ativa);
  if(S.layout==='auto'){const list=live.length?live:[{id:0,nome:'Câmera',estado:d?'erro':'iniciando',direcao:'AUTO',ativa:true}];
    return list.map((m,i)=>({kind:'live',m,label:camLabel(i+1)})).concat(extraCams().map((m,i)=>({kind:'cam',m,label:camLabel(list.length+i+1)})))}
  // layout fixo: as câmeras reais vêm primeiro; o resto dos monitores replica a CAM 01
  const n=+S.layout,base=live[0]||{nome:'Câmera',direcao:'AUTO'},extra=extraCams().slice(0,n-1);
  return Array.from({length:n},(_,i)=>i===0?{kind:'live',m:base,label:camLabel(1)}:i<=extra.length?{kind:'cam',m:extra[i-1],label:camLabel(i+1)}:{kind:'demo',m:base,label:camLabel(i+1)})}
function extraCams(){return (S.data?.monitores||[]).filter(m=>!m.ativa&&!m.ficticia)}    // outras câmeras reais: só vídeo, sem IA

function buildWall(){S.tiles.forEach(t=>{if(t.img)t.img.src=''});const list=slots(),[c,r]=gridFor(list.length),wall=$('#wall');
  wall.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;wall.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;
  wall.innerHTML='';S.tiles=[];const small=c>=5||r>=4;
  list.forEach((sl,i)=>{const t=document.createElement('div');t.className='tile'+(small?' small':'');t.dataset.i=i;
    const tag=sl.kind==='live'?'<span class="tag live"><span class="r"></span>AO VIVO · IA</span>':sl.kind==='cam'?'<span class="tag vid" title="Só o vídeo: a inteligência artificial está na câmera ativa">VÍDEO · SEM IA</span>':'<span class="tag demo">DEMO</span>';
    t.innerHTML=`<div class="ov t"><span class="cam">${sl.label}</span><span class="name"></span>${tag}</div>
      <div class="ov b"><span class="ts num"></span><span class="dir"></span></div><div class="msg"></div>`;
    if(sl.kind==='live')t.insertBefore(video,t.firstChild);
    else if(sl.kind==='cam'&&sl.m.video){const im=new Image();im.alt=sl.m.nome;im.decoding='async';im.src=`/video/${sl.m.id}?m=${Date.now()}`;
      im.onerror=()=>{if(!im.getAttribute('src'))return;im.removeAttribute('src');sl.err=true;paintTiles();setTimeout(()=>{sl.err=false;if(t.isConnected)im.src=`/video/${sl.m.id}?m=${Date.now()}`},8000)};
      t.insertBefore(im,t.firstChild);sl.img=im}
    else{const cv=document.createElement('canvas');t.insertBefore(cv,t.firstChild);sl.cv=cv}
    t.onclick=()=>select(i);t.ondblclick=()=>toggleSolo(i);wall.appendChild(t);S.tiles.push({el:t,...sl})});
  for(let i=list.length;i<c*r;i++){const t=document.createElement('div');t.className='tile empty'+(small?' small':'');t.innerHTML=`<div class="msg"><div><b>SEM SINAL</b>${camLabel(i+1)}</div></div>`;wall.appendChild(t)}
  if(S.sel>=list.length)S.sel=0;S.solo=S.solo&&S.sel<list.length;applySel();paintTiles();sizeCanvases();
  $$('#lay button').forEach(b=>b.classList.toggle('on',b.dataset.n===S.layout))}
function setLayout(n){S.layout=n;store.set('layout',n);S.solo=false;buildWall();if(S.mgr)renderMgr()}
function select(i){S.sel=i;applySel();if(S.mgr)renderMgr()}
function toggleSolo(i){if(i!==undefined)S.sel=i;S.solo=!S.solo;applySel();sizeCanvases()}
function applySel(){S.tiles.forEach((t,i)=>t.el.classList.toggle('sel',i===S.sel&&(S.tiles.length>1||S.solo)));$('#wall').classList.toggle('solo',S.solo)}

function paintTiles(){const now=new Date(),ts=now.toLocaleString(window.RealGuardI18n?.getLocale()||'pt-BR');
  S.tiles.forEach(t=>{const m=t.m||{},d=DIR[m.direcao]||DIR.AUTO,el=t.el;
    el.querySelector('.name').textContent=t.kind==='demo'?'espelho da CAM 01':m.nome+(m.local?' · '+m.local:'');
    el.querySelector('.ts').textContent=ts;const dir=el.querySelector('.dir');dir.className='dir '+d[0];
    dir.textContent=d[1]+(t.kind==='live'&&m.pessoas?` · ${m.pessoas} pessoa${m.pessoas>1?'s':''}`:'');
    const msg=el.querySelector('.msg');if(t.kind==='cam'){      // com vídeo, a própria imagem mostra "conectando…"
      msg.innerHTML=!m.video?'<div><b>SEM SENHA</b>guarde a senha desta câmera no dashboard<br>(Ao vivo → toque na câmera → Salvar)</div>':t.err?'<div><b>SEM IMAGEM</b>tentando de novo…</div>':'';return}
    const st=m.estado||'iniciando';
    msg.innerHTML=st==='online'?'':`<div><b>${st==='reconectando'?'SEM IMAGEM':st==='erro'?'MOTOR PARADO':'INICIANDO'}</b>${st==='reconectando'?'reconectando à câmera…':st==='erro'?esc(S.data?.erro||'verifique o terminal do RealGuard'):'carregando os modelos de IA…'}</div>`})}

/* cópias de demonstração: ~12 quadros/s, só quando há canvases visíveis */
function sizeCanvases(){const dpr=Math.min(window.devicePixelRatio||1,1.5);S.tiles.forEach(t=>{if(!t.cv)return;const r=t.el.getBoundingClientRect();
  t.cv.width=Math.max(2,Math.round(r.width*dpr));t.cv.height=Math.max(2,Math.round(r.height*dpr))})}
let lastDraw=0;
function draw(ts){requestAnimationFrame(draw);if(ts-lastDraw<80)return;lastDraw=ts;
  const w=video.naturalWidth,h=video.naturalHeight;if(!w||!h)return;
  for(const t of S.tiles){if(!t.cv||t.el.offsetParent===null)continue;const c=t.cv,ctx=c.getContext('2d'),s=Math.min(c.width/w,c.height/h),dw=w*s,dh=h*s;
    try{ctx.fillStyle='#030405';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(video,(c.width-dw)/2,(c.height-dh)/2,dw,dh)}catch(e){}}}
requestAnimationFrame(draw);
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(sizeCanvases,120)});

/* ---------- dados ---------- */
let lastLiveCount='';
async function poll(){try{const d=await api('/api/monitores');S.data=d;
    const live=d.monitores.filter(m=>!m.ficticia||m.ativa).map(m=>m.id+(m.ativa?'*':'')+(m.video?'v':'')).join(','),act0=d.monitores.find(x=>x.ativa);
    if(live!==lastLiveCount){lastLiveCount=live;buildWall()}
    for(const t of S.tiles){const m=t.kind==='demo'?act0:d.monitores.find(x=>x.id===(t.m||{}).id)||act0;if(m)t.m=m}
    paintTiles();
    const sys=d.sistema||{},act=d.monitores.find(m=>m.ativa)||{};
    push(S.hist.cpu,sys.cpu_pct);for(const m of d.monitores)if(m.ativa){S.hist.fps[m.id]=S.hist.fps[m.id]||[];push(S.hist.fps[m.id],m.fps_camera)}
    pill(d,act,sys);if(S.mgr)renderMgr();$('#mgrUpd').textContent='atualizado '+new Date().toLocaleTimeString(window.RealGuardI18n?.getLocale()||'pt-BR')}
  catch(e){$('#sysDot').className='dot bad';$('#sysTxt').textContent='sem conexão';$('#sysExtra').textContent=''}}
const push=(a,v)=>{if(v===null||v===undefined)return;a.push(+v);if(a.length>60)a.shift()};
function pill(d,act,sys){const st=act.estado||d.estado,cls=st==='online'?'good':st==='inativa'||st==='erro'?'bad':'warn';
  $('#sysDot').className='dot '+cls;$('#sysTxt').textContent=st==='online'?'Operando':(STATE[st]||['',st])[1];
  const bits=[];if(act.fps_camera!=null)bits.push(`${act.fps_camera} fps`);if(sys.ms_deteccao)bits.push(`IA ${Math.round(sys.ms_deteccao)} ms`);
  if(sys.cpu_pct!=null)bits.push(`CPU ${Math.round(sys.cpu_pct)}%`);if(sys.temp_c!=null)bits.push(`${Math.round(sys.temp_c)} °C`);
  $('#sysExtra').innerHTML=bits.length?'<span class="sep" style="display:inline-block;vertical-align:middle;margin-right:7px"></span>'+bits.map(esc).join(' · '):''}

/* ---------- gerenciador ---------- */
function spark(arr,max,color){if(arr.length<2)return '<svg class="spark"></svg>';const W=300,H=30,m=max||Math.max(1,...arr);
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*W).toFixed(1)},${(H-2-(Math.min(v,m)/m)*(H-4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
function meter(k,v,unit,pct,extra=''){const lvl=pct==null?'':pct>=85?'bad':pct>=65?'warn':'';
  return `<div class="meter"><div class="k"><span>${k}</span>${extra}</div><div class="v num">${v==null?'—':esc(v)}<small>${v==null?'':unit}</small></div>${pct==null?'':`<div class="track"><div class="fill ${lvl}" style="width:${Math.max(2,Math.min(100,pct))}%"></div></div>`}</div>`}
const dur=s=>s==null?'—':s<3600?`${Math.floor(s/60)} min`:s<86400?`${Math.floor(s/3600)} h ${Math.floor(s%3600/60)} min`:`${Math.floor(s/86400)} d ${Math.floor(s%86400/3600)} h`;
function renderMgr(){const d=S.data,b=$('#mgrBody');if(!d){b.innerHTML='<p class="note">Carregando…</p>';return}
  const sys=d.sistema,demo=S.layout!=='auto',selM=(S.tiles[S.sel]||{});let h='';
  if(demo)h+=`<p class="note" style="margin-top:12px">${ic('camera')} Modo demonstração: ${S.layout} monitores. ${extraCams().length?'As câmeras cadastradas aparecem primeiro (IA só na <b>CAM 01</b>); os demais monitores replicam a CAM 01.':'Todos replicam a <b>CAM 01</b>; só ela é transmissão real.'}</p>`;
  if(sys){h+=`<h3>Equipamento<span>${d.estado==='running'?'IA rodando há '+dur(sys.ligado_s):esc(d.estado)}</span></h3><div class="meters">
      ${meter('CPU',sys.cpu_pct==null?null:Math.round(sys.cpu_pct),'%',sys.cpu_pct,sys.nucleos?`<span>${sys.nucleos} núcleos</span>`:'')}
      ${meter('Memória',sys.mem_pct==null?null:Math.round(sys.mem_pct),'%',sys.mem_pct,sys.processo_mb?`<span>app ${Math.round(sys.processo_mb)} MB</span>`:'')}
      ${meter('Temperatura',sys.temp_c==null?null:Math.round(sys.temp_c),'°C',sys.temp_c==null?null:sys.temp_c/0.95)}
      ${meter('Carga (1 min)',sys.carga,'',null)}</div>
      <div class="meter" style="margin-top:8px"><div class="k"><span>CPU no último minuto</span><span>${S.hist.cpu.length?Math.round(Math.max(...S.hist.cpu))+'% pico':''}</span></div>${spark(S.hist.cpu,100,'#3987e5')}</div>
      <h3>Inteligência artificial</h3><div class="meters">
      ${meter('Detecção (YOLO)',sys.ms_deteccao==null?null:Math.round(sys.ms_deteccao),' ms',null)}
      ${meter('Reconhecimento',sys.reconhecimento_facial?(sys.ms_reconhecimento==null?null:Math.round(sys.ms_reconhecimento)):'desligado',sys.reconhecimento_facial?' ms':'',null)}
      ${meter('Fila de rostos',sys.fila_reconhecimento,'',null)}
      ${meter('Rostos na base',sys.rostos_na_base,'',null)}</div>`}
  h+=`<h3>Câmeras<span>${d.monitores.filter(m=>m.ativa).length} transmitindo · ${d.monitores.length} cadastrada(s)</span></h3>`;
  h+=d.monitores.map(m=>{const st=STATE[m.estado]||['',m.estado],dir=DIR[m.direcao]||DIR.AUTO,isSel=m.ativa&&selM.kind==='live';
    return `<div class="cardm ${isSel?'sel':''}"><div class="hd"><span class="dot ${st[0]}"></span><b title="${esc(m.nome)}">${m.ativa?'CAM 01 · ':''}${esc(m.nome)}</b><span class="badge ${st[0]}">${st[1]}</span></div>
      <div class="src">${m.tipo==='webcam'?'Webcam':'RTSP'} · ${esc(m.fonte||'—')}${m.local?' · '+esc(m.local):''}${m.ficticia?' · fictícia':''}</div>
      ${m.ativa?`<div class="kv">
        <div><span>FPS câmera</span><b class="num">${m.fps_camera??'—'}</b></div><div><span>FPS do vídeo</span><b class="num">${m.fps_video??'—'}</b></div><div><span>Resolução</span><b class="num">${esc(m.resolucao||'—')}</b></div>
        <div><span>Último quadro</span><b class="num">${m.ultimo_quadro_s==null?'—':m.ultimo_quadro_s<1?'agora':m.ultimo_quadro_s+' s'}</b></div><div><span>Pessoas</span><b class="num">${m.pessoas??0}</b></div><div><span title="identificadas / não cadastradas / rosto obstruído">Id. / desc. / obstr.</span><b class="num">${m.reconhecidos??0} / ${m.desconhecidos??0} / ${m.obstruidos??0}</b></div></div>
        ${spark(S.hist.fps[m.id]||[],null,'#22b04a')}
        <div class="row">${d.pode.modo?`<div class="seg" data-mode>${['AUTO','ENTRY','EXIT'].map(k=>`<button data-m="${k}" class="${m.direcao===k?'on':''}">${DIR[k][1][0]+DIR[k][1].slice(1).toLowerCase()}</button>`).join('')}</div>`:`<span class="badge">${dir[1]}</span>`}
          <span class="badge" title="Espelhamento automático: webcam espelhada, câmera IP não">${m.espelhado?'espelhada':'sem espelho'}</span></div>
        <div class="row"><button class="ibtn" data-focus>${ic('focus')}Focar</button><button class="ibtn" data-shot>${ic('camera')}Foto</button></div>`
      :`<div class="row">${d.pode.cameras&&!m.ficticia?`<button class="ibtn" data-act="${m.id}">${ic('power')}Passar a IA para esta câmera</button>`:''}<span class="note" style="margin:0">${m.ficticia?'Cadastro fictício, sem câmera real.':m.video?'Mostra só o vídeo: a IA analisa uma câmera por vez.':'Guarde a senha dela no dashboard (Ao vivo → câmera) para ver o vídeo aqui.'}</span></div>`}</div>`}).join('');
  h+=`<h3>Atalhos</h3><div class="keys"><kbd>1–9</kbd><span>selecionar monitor</span><kbd>Duplo clique</kbd><span>ampliar / voltar (ou Enter)</span><kbd>Esc</kbd><span>voltar à grade / fechar</span><kbd>A</kbd><span>divisão automática</span><kbd>D</kbd><span>alternar demonstração 4 → 8 → 16 → 32</span><kbd>G</kbd><span>gerenciador</span><kbd>F</kbd><span>tela cheia</span></div>`;
  b.innerHTML=h;
  $$('#mgrBody [data-m]').forEach(x=>x.onclick=async()=>{try{const f=new FormData();f.append('mode',x.dataset.m);await api('/api/mode',{method:'POST',body:f});toast('Modo da câmera: '+DIR[x.dataset.m][1].toLowerCase()+'.');poll()}catch(e){toast(e.message,false)}});
  $$('#mgrBody [data-focus]').forEach(x=>x.onclick=()=>{S.sel=0;S.solo=true;applySel();sizeCanvases()});
  $$('#mgrBody [data-shot]').forEach(x=>x.onclick=snapshot);
  $$('#mgrBody [data-act]').forEach(x=>x.onclick=async()=>{x.disabled=true;try{const r=await api(`/api/cameras/${x.dataset.act}/activate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:'',persist:false})});toast(r.message);setTimeout(liveSrc,4000)}catch(e){toast(e.message+' Use Ao vivo → Câmeras no dashboard.',false);x.disabled=false}})}
function setMgr(open){S.mgr=open;store.set('mgr',open?'1':'0');$('#mgr').classList.toggle('open',open);$('#mgr').setAttribute('aria-hidden',open?'false':'true');$('#mgrBtn').classList.toggle('on',open);if(open)renderMgr()}
function snapshot(){const w=video.naturalWidth,h=video.naturalHeight;if(!w)return toast('Sem imagem no momento.',false);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(video,0,0);
  c.toBlob(b=>{const a=document.createElement('a'),n=new Date();a.href=URL.createObjectURL(b);a.download=`realguard-cam01-${n.getFullYear()}${pad2(n.getMonth()+1)}${pad2(n.getDate())}-${pad2(n.getHours())}${pad2(n.getMinutes())}${pad2(n.getSeconds())}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/jpeg',0.9)}

/* ---------- interação ---------- */
$$('#lay button').forEach(b=>b.onclick=()=>setLayout(b.dataset.n));
$('#mgrBtn').onclick=$('#sysPill').onclick=()=>setMgr(!S.mgr);$('#mgrClose').onclick=()=>setMgr(false);
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}
$('#fsBtn').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>setTimeout(sizeCanvases,150));
$('#dashLink').onclick=e=>{try{if(window.opener&&!window.opener.closed){e.preventDefault();window.opener.focus()}}catch(err){}};
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k>='1'&&k<='9'){const i=+k-1;if(i<S.tiles.length){select(i);if(S.solo){applySel();sizeCanvases()}}}
  else if(k==='enter')toggleSolo();else if(k==='escape'){if(S.solo)toggleSolo();else if(S.mgr)setMgr(false)}
  else if(k==='g')setMgr(!S.mgr);else if(k==='f')fullscreen();else if(k==='a')setLayout('auto');
  else if(k==='d'){const seq=['4','8','16','32'],i=seq.indexOf(S.layout);setLayout(seq[(i+1)%seq.length])}});
let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3500)};
['mousemove','mousedown','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));wake();
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString(window.RealGuardI18n?.getLocale()||'pt-BR');if(!document.hidden)paintTiles()},1000);
/* o vídeo trava se a conexão cair: reabre a cada 20 s sem quadro novo */
let lastW=0,stall=0;video.onload=()=>{stall=0};video.onerror=()=>setTimeout(liveSrc,3000);
setInterval(()=>{const m=(S.data?.monitores||[]).find(x=>x.ativa);if(m&&m.ultimo_quadro_s!=null&&m.ultimo_quadro_s<3&&!video.naturalWidth){if(++stall>4){stall=0;liveSrc()}}},4000);

(async()=>{try{const me=await api('/api/auth/me');if(me.trocar_senha)return location.replace('/login?trocar=1');
    if(!me.permissoes.includes('live.view')){document.body.innerHTML='<p style="margin:40px;color:#aab4c3">Seu perfil não tem acesso ao vídeo.</p>';return}}catch(e){return}
  liveSrc();buildWall();setMgr(S.mgr);await poll();setInterval(()=>{if(!document.hidden)poll()},2000)})();
</script>
</body>
</html>
