<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurações · RealGuard</title>
<style>
:root{color-scheme:dark;--bg:#070f1f;--card:#0d1b30;--line:#243852;--ink:#f2f5fa;--muted:#91a3bd;--gold:#dbb45d;--blue:#378ee8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#142948 0,transparent 38%),var(--bg);color:var(--ink);font:14px/1.5 Arial,system-ui,sans-serif;min-height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:18px max(24px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line);background:#0a1528}.logo{display:flex;align-items:center;gap:12px}.logo svg{width:31px;height:38px}.logo b{display:block;letter-spacing:.08em;font-size:17px}.logo small{display:block;color:var(--muted);font-size:11px}.bar .rg-locale{margin-left:auto}
main{max-width:980px;margin:34px auto 60px;padding:0 24px}h1{margin:0;font-size:29px;letter-spacing:-.03em}p.intro{color:var(--muted);margin:8px 0 26px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px}.card h2{font-size:17px;margin:0 0 18px}.card h2 em{font-style:normal;color:var(--gold);margin-right:8px}.field{display:block;margin:14px 0;color:#c9d5e6;font-size:12px;font-weight:600}.field>span{display:block;margin-bottom:6px}input,select{width:100%;min-height:40px;border:1px solid #334b6a;border-radius:9px;background:#091529;color:var(--ink);font:14px Arial,system-ui,sans-serif;padding:8px 11px}input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.hint{color:var(--muted);font-size:12px;margin:3px 0 8px}.wide{grid-column:1/-1}.hidden{display:none!important}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:1px solid #38577b;border-radius:9px;background:#152a47;color:var(--ink);padding:10px 16px;font-weight:700;cursor:pointer}.btn:hover{background:#20416a}.btn.primary{background:var(--gold);border-color:var(--gold);color:#101925}.btn.primary:hover{background:#efca79}.btn:disabled{opacity:.5;cursor:wait}.status{min-height:22px;color:var(--muted)}.status.bad{color:#ff898f}.status.ok{color:#70df9a}.foot{margin-top:24px;color:var(--muted);font-size:12px}
@media(max-width:750px){.cards{grid-template-columns:1fr}.bar{padding:15px 20px}main{margin-top:25px}}
.cards{display:block;max-width:570px}.card{padding:0;margin:0 0 20px;border:0;border-radius:0;background:transparent}.card h2{display:none}.grid{display:block}.wide{grid-column:auto}
</style></head><body>
<div class="bar"><div class="logo"><svg viewBox="0 0 38 44" fill="none" aria-hidden="true"><path d="M19 2 34 8v14c0 10-6 16-15 20C10 38 4 32 4 22V8L19 2Z" stroke="#d8e1ed" stroke-width="2.5"/><circle cx="19" cy="17" r="5" fill="#dbb45d"/><path d="M10 31c1-6 5-9 9-9s8 3 9 9" fill="#dbb45d"/></svg><div><b>REALGUARD</b><small>Controle de acesso</small></div></div></div>
<main>
<form id="form"><div class="cards">
<section class="card">
<label class="field"><span>Modo de execução</span><select id="mode"><option value="complete">RealGuard</option><option value="arena">Homologação</option></select></label>
</section>
<section class="card">
<label class="field"><span>Fonte de vídeo</span><select id="camera_mode"><option value="webcam">Webcam do computador</option><option value="rtsp">Câmera IP (RTSP)</option><option value="auto">Automática · IP ou webcam</option></select></label>
<div id="webcamFields"><label class="field"><span>Índice da webcam</span><input id="camera_index" type="number" min="0" max="15" value="0"></label></div>
<div id="rtspFields" class="grid hidden"><label class="field"><span>IP da câmera</span><input id="camera_ip" autocomplete="off"></label><label class="field"><span>Porta RTSP</span><input id="camera_port" inputmode="numeric"></label><label class="field wide"><span>Caminho RTSP</span><input id="camera_path" autocomplete="off"></label><label class="field"><span>Usuário da câmera</span><input id="camera_user" autocomplete="off"></label><label class="field"><span>Senha da câmera</span><input id="camera_password" type="password" autocomplete="new-password" placeholder="Deixe vazio para manter a atual"></label><div class="wide"><button class="btn" id="testCamera" type="button">Testar câmera</button></div></div>
</section>
<section class="card">
<label class="field"><span>Conexão</span><select id="proxy_enabled"><option value="false">Direta · sem proxy</option><option value="true">Proxy do notebook mestre</option></select></label>
<div id="proxyFields" class="grid hidden"><label class="field"><span>IP do proxy</span><input id="proxy_host" autocomplete="off"></label><label class="field"><span>Porta do proxy</span><input id="proxy_port" inputmode="numeric"></label><label class="field"><span>Usuário do proxy</span><input id="proxy_user" autocomplete="off"></label><label class="field"><span>Senha do proxy</span><input id="proxy_password" type="password" autocomplete="new-password" placeholder="Deixe vazio para manter a atual"></label><div class="wide"><button class="btn" id="testProxy" type="button">Testar internet</button></div></div>
</section>
<section class="card hidden" id="firstAdmin"><p class="hint">Primeiro administrador</p>
<label class="field"><span>Usuário</span><input id="admin_user" autocomplete="username"></label><label class="field"><span>Nome</span><input id="admin_name" autocomplete="name"></label><label class="field"><span>Senha</span><input id="admin_password" type="password" autocomplete="new-password" minlength="8"></label></section>
</div><div class="actions"><span id="status" class="status" role="status" aria-live="polite"></span><button class="btn primary" id="save" type="submit">Salvar e iniciar</button></div></form>
</main>
<script src="/ui/i18n.js"></script><script>
const $=id=>document.getElementById(id), boot=location.pathname==='/setup';
const token=new URLSearchParams(location.search).get('token')||'';
const endpoint=boot?'/setup/config?token='+encodeURIComponent(token):'/api/system/preconfig';
function fields(){const keys=['mode','camera_mode','camera_index','camera_ip','camera_port','camera_path','camera_user','camera_password','proxy_host','proxy_port','proxy_user','proxy_password'];const out={};for(const key of keys)out[key]=$(key).value;out.locale=window.RealGuardI18n?.getLocale()||'pt-BR';out.proxy_enabled=$('proxy_enabled').value==='true';if(boot){out.admin_user=$('admin_user').value;out.admin_name=$('admin_name').value;out.admin_password=$('admin_password').value}return out}
function updateVisible(){$('webcamFields').classList.toggle('hidden',$('camera_mode').value!=='webcam');$('rtspFields').classList.toggle('hidden',$('camera_mode').value==='webcam');$('proxyFields').classList.toggle('hidden',$('proxy_enabled').value!=='true')}
function status(message,bad=false,ok=false){$('status').textContent=message;$('status').className='status'+(bad?' bad':ok?' ok':'')}
async function call(url,options={}){const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-RealGuard':'1'},...options});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw Error(data.detail||data.message||'Falha na solicitação.');return data}
async function load(){try{const data=await call(endpoint);for(const [key,value] of Object.entries(data)){if($(key)&&key!=='proxy_enabled')$(key).value=value??''} $('proxy_enabled').value=String(!!data.proxy_enabled);$('firstAdmin').classList.toggle('hidden',!data.needs_admin);$('save').textContent=boot?'Salvar e iniciar':'Salvar e reiniciar';updateVisible()}catch(error){status(error.message,true)}}
async function runTest(target){const button=$(target==='camera'?'testCamera':'testProxy');button.disabled=true;status('Testando conexão…');try{const base=boot?'/setup/test/':'/api/system/preconfig/test/';const url=base+target+(boot?'?token='+encodeURIComponent(token):'');const data=await call(url,{method:'POST',body:JSON.stringify(fields())});status(data.message,!data.ok,data.ok)}catch(error){status(error.message,true)}finally{button.disabled=false}}
async function waitForStart(){for(let i=0;i<120;i++){await new Promise(resolve=>setTimeout(resolve,1000));try{const result=await call('/setup/ready?token='+encodeURIComponent(token));if(result.ready){location.replace(result.url);return}if(result.failed)throw Error('O RealGuard não iniciou. Consulte logs/console.log.')}catch(error){if(error.message.includes('não iniciou')){status(error.message,true);$('save').disabled=false;return}}}status('O início demorou mais que o esperado. Consulte logs/console.log.',true);$('save').disabled=false}
async function waitForRestart(){await new Promise(resolve=>setTimeout(resolve,2500));for(let i=0;i<90;i++){try{const response=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(response.ok){location.replace('/');return}}catch(_){}await new Promise(resolve=>setTimeout(resolve,1000))}status('O reinício demorou mais que o esperado. Atualize a página ou consulte o terminal/log.',true);$('save').disabled=false}
$('camera_mode').addEventListener('change',updateVisible);$('proxy_enabled').addEventListener('change',updateVisible);$('testCamera').onclick=()=>runTest('camera');$('testProxy').onclick=()=>runTest('proxy');
$('form').onsubmit=async event=>{event.preventDefault();$('save').disabled=true;status(boot?'Salvando e iniciando…':'Salvando e reiniciando…');try{await call(endpoint,{method:'POST',body:JSON.stringify(fields())});if(boot)await waitForStart();else await waitForRestart()}catch(error){status(error.message,true);$('save').disabled=false}};
load();
</script></body></html>
